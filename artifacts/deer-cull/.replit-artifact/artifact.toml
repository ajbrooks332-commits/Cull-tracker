kind = "mobile"
previewPath = "/"
title = "Deer Culling Records"
version = "1.0.0"
id = "artifacts/deer-cull"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
localPort = 18432
name = "expo"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/deer-cull run dev"

[services.env]
PORT = "18432"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/deer-cull", "run", "build"]
run = ["pnpm", "--filter", "@workspace/deer-cull", "run", "serve"]
