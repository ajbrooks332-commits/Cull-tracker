kind = "web"
previewPath = "/web/"
title = "Deer Cull Records — Web"
version = "1.0.0"
id = "artifacts/deer-cull-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 23641
name = "web"
paths = ["/web/"]

[services.development]
run = "pnpm --filter @workspace/deer-cull-web run dev"

[services.env]
PORT = "23641"
BASE_PATH = "/web/"

[services.production]
build = ["pnpm", "--filter", "@workspace/deer-cull-web", "run", "build"]
publicDir = "artifacts/deer-cull-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
