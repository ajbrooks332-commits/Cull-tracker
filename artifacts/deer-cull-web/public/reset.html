<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset App</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
    .box { background: white; border-radius: 12px; padding: 32px 24px; max-width: 340px; width: 100%; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    h1 { font-size: 1.2rem; margin: 0 0 8px; }
    p { color: #666; font-size: 0.9rem; margin: 0 0 24px; }
    button { background: #21503A; color: white; border: none; border-radius: 8px; padding: 14px 24px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; }
    .done { color: #21503A; font-weight: 600; margin-top: 16px; display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Clear App Data</h1>
    <p>This will clear all cached data and cookies for Deer Cull Records so you can start fresh.</p>
    <button onclick="clearAll()">Clear &amp; Reset</button>
    <p class="done" id="done">Done! <a href="/web/">Open app →</a></p>
  </div>
  <script>
    async function clearAll() {
      try { localStorage.clear(); } catch(e) {}
      try { sessionStorage.clear(); } catch(e) {}
      try {
        const dbs = await indexedDB.databases?.() || [];
        for (const db of dbs) { if (db.name) indexedDB.deleteDatabase(db.name); }
      } catch(e) {}
      try {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      } catch(e) {}
      try {
        const regs = await navigator.serviceWorker?.getRegistrations() || [];
        await Promise.all(regs.map(r => r.unregister()));
      } catch(e) {}
      document.getElementById('done').style.display = 'block';
    }
  </script>
</body>
</html>
